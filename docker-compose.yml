services:

  # ------------------ POSTGRES ------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflowpassword
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bigdata-net
    restart: unless-stopped

  # ------------------ AIRFLOW WEBSERVER ------------------
  airflow-webserver:
    build: .
    container_name: airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: 'JhtR0LxrLX4758f5g84FjZaFI5bXxFfxQKZ3Jnafwko='
      AIRFLOW__WEBSERVER__SECRET_KEY: 'supersecretkey123'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@postgres:5432/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/spark/jobs
      - data_lake:/data
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true &&
      airflow webserver
      "
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bigdata-net
    restart: unless-stopped

  # ------------------ AIRFLOW SCHEDULER ------------------
  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: 'JhtR0LxrLX4758f5g84FjZaFI5bXxFfxQKZ3Jnafwko='
      AIRFLOW__WEBSERVER__SECRET_KEY: 'supersecretkey123'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpassword@postgres:5432/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark/jobs:/opt/spark/jobs
      - data_lake:/data
    command: >
      bash -c "
      airflow db migrate &&
      airflow scheduler
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bigdata-net
    restart: unless-stopped

  # ------------------ SPARK MASTER ------------------
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - data_lake:/data
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - bigdata-net
    restart: unless-stopped

  # ------------------ SPARK WORKER ------------------
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    ports:
      - "8083:8080"
    volumes:
      - data_lake:/data
    depends_on:
      - spark-master
    networks:
      - bigdata-net
    restart: unless-stopped

  # ------------------ ZOOKEEPER ------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - bigdata-net
    restart: unless-stopped

  # ------------------ KAFKA ------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bigdata-net
    restart: unless-stopped

  # ------------------ HIVE ------------------
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    environment:
      HIVE_METASTORE_DB_HOST: postgres
      HIVE_METASTORE_DB_NAME: airflow
      HIVE_METASTORE_DB_USER: airflow
      HIVE_METASTORE_DB_PASS: airflowpassword
    ports:
      - "10000:10000"
    volumes:
      - data_lake:/data
    depends_on:
      - postgres
    networks:
      - bigdata-net
    restart: unless-stopped

volumes:
  postgres_data:
  data_lake:

networks:
  bigdata-net:
    driver: bridge
